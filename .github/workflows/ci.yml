name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install declared Rust baseline
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo +1.99.1 fetch --locked
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Lint entire workspace, including test targets
        run: cargo +1.99.1 clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Link all Windows test binaries without executing recovery tests
        if: runner.os == 'Windows'
        run: cargo +1.99.1 test --workspace --no-run --locked --offline
      - name: Test portable workspace paths on Linux
        if: runner.os == 'Linux'
        run: cargo +1.99.1 test --workspace --locked --offline
      - name: Test deterministic packages on Windows
        if: runner.os == 'Windows'
        run: cargo +1.99.1 test -p autotune-probe -p autotune-power-trial -p autotune-recovery-contract -p autotune-recovery-core -p autotune-measurement -p autotune-fma-reference -p autotune-benchmark-worker --locked --offline
      - name: Compile and lint opt-in CUDA adapter without loading a driver
        if: runner.os == 'Windows'
        run: cargo +1.99.1 clippy -p autotune-benchmark-worker --all-targets --features native-cuda --locked --offline -- -D warnings
      - name: Test only typed CUDA ABI fakes, never native loading
        if: runner.os == 'Windows'
        run: cargo +1.99.1 test -p autotune-benchmark-worker --lib --features native-cuda --locked --offline
      - name: Report Windows execution boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'Windows recovery-windows and recovery-harness tests were compiled/linked, not executed. The five ignored benchmark-worker owned-process tests were also not executed, and no CUDA adapter or GPU driver was loaded. This job does not establish recovery acceptance, process-containment acceptance or hardware qualification.' >> $env:GITHUB_STEP_SUMMARY
