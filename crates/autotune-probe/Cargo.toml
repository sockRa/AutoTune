[package]
name = "autotune-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
