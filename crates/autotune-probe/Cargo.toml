[package]
name = "autotune-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
